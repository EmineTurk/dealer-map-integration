services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: turkcell-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-OraclePassword123}
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Init scripts run only when oracle-data is initialized for the first time.
      - ./docker/oracle/init/01_create_app_users.sql:/container-entrypoint-initdb.d/01_create_app_users.sql:ro
      - ./store-service/sql/01_create_store_table.sql:/container-entrypoint-initdb.d/10_create_store_table.sql:ro
      - ./store-service/sql/02_alter_store_day7_columns.sql:/container-entrypoint-initdb.d/11_alter_store_day7_columns.sql:ro
      - ./store-service/sql/03_create_store_capability.sql:/container-entrypoint-initdb.d/12_create_store_capability.sql:ro
      - ./stock-service/sql/schema.sql:/container-entrypoint-initdb.d/20_create_stock_schema.sql:ro
      - ./stock-service/sql/data.sql:/container-entrypoint-initdb.d/21_seed_stock_data.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 180s

  redis:
    image: redis:7.4-alpine
    container_name: turkcell-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  store-service:
    build: ./store-service
    container_name: store-service
    ports:
      - "8081:8081"
    environment:
      - STORE_DB_URL=jdbc:oracle:thin:@oracle:1521/FREEPDB1
      - REDIS_HOST=redis
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  stock-service:
    build: ./stock-service
    container_name: stock-service
    ports:
      - "8080:8080"
    environment:
      - STOCK_DB_URL=jdbc:oracle:thin:@oracle:1521/FREEPDB1
      - STORE_SERVICE_BASE_URL=http://store-service:8081
      - REDIS_HOST=redis
    depends_on:
      oracle:
        condition: service_healthy
      store-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  capability-service:
    build: ./capability-service
    container_name: capability-service
    ports:
      - "8082:8082"
    environment:
      - CAPABILITY_DB_URL=jdbc:oracle:thin:@oracle:1521/FREEPDB1
      - STORE_SERVICE_BASE_URL=http://store-service:8081
      - REDIS_HOST=redis
    depends_on:
      oracle:
        condition: service_healthy
      store-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8085:8085"
    environment:
      - STOCK_SERVICE_URI=http://stock-service:8080
      - STORE_SERVICE_URI=http://store-service:8081
      - CAPABILITY_SERVICE_URI=http://capability-service:8082
      - REDIS_HOST=redis
    depends_on:
      stock-service:
        condition: service_healthy
      store-service:
        condition: service_healthy
      capability-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: dealer-map-frontend
    ports:
      - "8080:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  oracle-data:
  redis-data:
