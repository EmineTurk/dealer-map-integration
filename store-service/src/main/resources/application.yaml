spring:
  application:
    name: store-service

  datasource:
    url: ${STORE_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${STORE_DB_USERNAME:store_app}
    password: ${STORE_DB_PASSWORD:StoreApp123}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

  cache:
    type: redis

server:
  port: ${STORE_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches

logging:
  level:
    org.springframework.cache.interceptor.CacheInterceptor: TRACE

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

store-service:
  # used by docs / clients
  base-url: ${STORE_SERVICE_BASE_URL:http://localhost:8081}

# Day 13: CORS moved to api-gateway (port 8085). Do not re-enable here.
